name: Standard extension's make check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PG ${{ matrix.pg_version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pg_version: [17, 18, 19]

    steps:
    - name: Checkout extension code
      uses: actions/checkout@v4
      with:
        path: pg_track_optimizer

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libreadline-dev \
          zlib1g-dev \
          flex \
          bison \
          libxml2-dev \
          libxslt-dev \
          libssl-dev \
          libxml2-utils \
          xsltproc \
          libipc-run-perl \
          ccache

    - name: Resolve PostgreSQL ref
      id: pgref
      run: |
        set -euo pipefail
        V='${{ matrix.pg_version }}'
        REPO=https://github.com/postgres/postgres.git

        if [ "$V" = "master" ]; then
          REF=master
        else
          REF="REL_${V}_STABLE"
          if [ -z "$(git ls-remote --heads "$REPO" "refs/heads/$REF")" ]; then
            # A release still under development has no stable branch: it is cut
            # only around release-candidate time.  Until then the newest beta or
            # rc tag is the closest thing to that branch's tip.
            REF=$(git ls-remote --tags --refs "$REPO" \
                      "refs/tags/REL_${V}_BETA*" "refs/tags/REL_${V}_RC*" \
                  | sed 's,.*refs/tags/,,' | sort -V | tail -1)
            if [ -z "$REF" ]; then
              echo "PostgreSQL $V has neither a stable branch nor a beta/rc tag" >&2
              exit 1
            fi
          fi
        fi

        SHA=$(git ls-remote "$REPO" "$REF" | cut -f1)
        if [ -z "$SHA" ]; then
          echo "cannot resolve $REF in $REPO" >&2
          exit 1
        fi

        echo "ref=$REF" >> "$GITHUB_OUTPUT"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "PostgreSQL $V -> $REF ($SHA)"

    - name: Cache PostgreSQL build
      uses: actions/cache@v4
      id: pg-cache
      with:
        path: ~/postgresql
        key: ${{ runner.os }}-pgsrc-${{ matrix.pg_version }}-${{ steps.pgref.outputs.sha }}

    - name: Clone and build PostgreSQL
      if: steps.pg-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        git clone --depth 1 --branch '${{ steps.pgref.outputs.ref }}' \
            https://github.com/postgres/postgres.git ~/postgresql
        cd ~/postgresql
        # In-tree "make check" runs the suite against a throwaway instance it
        # builds itself, so no --prefix install is needed.  Injection points
        # and TAP support are what 004_torn_entry_injection.pl needs.
        ./configure --enable-debug --enable-cassert --enable-depend \
                    --enable-tap-tests --enable-injection-points
        make -j"$(nproc)"

    - name: Run the extension suite in-tree
      run: |
        set -euo pipefail
        # PGXS has no working "check" target - it prints an advisory and exits
        # 0 - so the suite has to run from inside a PostgreSQL source tree.
        # That is also the only way the TAP tests and the temp-instance
        # regression tests run at all.
        rsync -a --delete --exclude '.git' \
              "$GITHUB_WORKSPACE/pg_track_optimizer/" \
              ~/postgresql/contrib/pg_track_optimizer/
        make -C ~/postgresql/contrib/pg_track_optimizer check

    - name: Show regression diffs on failure
      if: failure()
      run: |
        cd ~/postgresql/contrib/pg_track_optimizer
        for f in regression.diffs regression.out; do
          [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
        done
        find tmp_check/log -type f -print -exec cat {} \; 2>/dev/null | head -500

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: regression-diffs-pg${{ matrix.pg_version }}
        path: |
          ~/postgresql/contrib/pg_track_optimizer/regression.diffs
          ~/postgresql/contrib/pg_track_optimizer/regression.out
          ~/postgresql/contrib/pg_track_optimizer/results/
          ~/postgresql/contrib/pg_track_optimizer/tmp_check/log/
        if-no-files-found: ignore
